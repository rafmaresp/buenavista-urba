<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incidencias Buenavista I</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: mapa a pantalla completa, barra superior fina, panel inferior deslizable (móvil) / lateral (escritorio) */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#d6dedb;
  --accent:#0f6b5c; --accent-fg:#ffffff;
  --st-nuevo:#c7362b; --st-encurso:#d98a00; --st-completado:#2f8a3e; --farola:#2a4b8d; --calle:#e8b100;
  --f-display:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111816; --surface:#1a2320; --fg:#e7eeeb; --muted:#9db0a9; --line:#2d3a36;
  --accent:#3fb39d; --accent-fg:#06221c; --farola:#8fb0f0; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);z-index:1000}
header h1{font-size:20px;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:13px}
.mode{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode button{border:0;background:transparent;padding:6px 12px;font-family:var(--f-display);font-weight:600;font-size:15px}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

main{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0;background:var(--bg)}
aside{width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;
  padding:16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%;border-left:0;border-top:1px solid var(--line);max-height:46%;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types label{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.types input{position:absolute;opacity:0;pointer-events:none}
.types input:checked + span{color:var(--accent)}
.types label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.types label:has(input:focus-visible){outline:2px solid var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
textarea,input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);width:100%}
.where{font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px}
.where b{font-family:var(--f-display);font-size:16px}
.thumb{max-width:100%;max-height:160px;border-radius:8px;display:block}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;font-family:var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.pill.nuevo{background:var(--st-nuevo)} .pill.encurso{background:var(--st-encurso)} .pill.completado{background:var(--st-completado)}
.list{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.card .t{font-family:var(--f-display);font-weight:700;font-size:16px}
.card .m{color:var(--muted);font-size:13px;grid-column:1/-1}
.card .a{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.card img{grid-column:1/-1;max-height:90px;width:auto;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.stats div{border-radius:8px;padding:6px 8px;background:var(--bg)}
.stats b{display:block;font-family:var(--f-display);font-size:22px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:8px;z-index:2000;font-weight:600}
pre.msg{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px;font-size:13px;margin:0;max-height:180px;overflow:auto}
.leaflet-container{font-family:var(--f-body)}
.lbl{background:transparent;border:0;box-shadow:none;font-family:var(--f-display);font-weight:700;font-size:11px;color:var(--fg);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.lbl::before{display:none}
</style>
</head>

</header>
<main>

/* ===== Configuración =====
   API_URL vacío: modo demo, las incidencias se guardan solo en este navegador (no se comparten entre vecinos).
   API_URL con valor: la página usa ese backend (p. ej. Azure Function) para que todos vean lo mismo:
     GET   {API_URL}            -> [incidencia, ...]
     POST  {API_URL}            <- incidencia nueva (el backend guarda y envía el correo a la junta)
     PATCH {API_URL}/{id}       <- { votos } o { estado }
   WHATSAPP_NUM: número de la junta/mantenedor en formato internacional sin '+', p. ej. '34600111222'. */
const CONFIG = { API_URL: '', WHATSAPP_NUM: '' };
const LS_I = 'bv1_incidencias_v2';
const TIPOS = {farola:'Farola fundida', bache:'Bache', fuga:'Fuga de agua', otro:'Otro'};
const ESTADOS = ['nuevo','encurso','completado'];
const EST_LBL = {nuevo:'Nuevo',encurso:'En curso',completado:'Completado'};
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast('No se pudo guardar (almacenamiento lleno o bloqueado)'); return false; } }

let farolas = DATA.farolas.map(f=>({...f,prec:f.verif?'±2–3 m (verificada)':'±5–8 m (estimada)'}));

let incid = store.get(LS_I, null);

/* ===== Mapa ===== */
const map = L.map('map',{zoomControl:true}).setView([37.3165,-5.9606],17);

function openFor(id){ return incid.find(i=>i.farolaId===id && i.estado!=='completado'); }
function drawFarolas(){
  lyFarolas.clearLayers();
  farolas.forEach(f=>{
    const radio = f.verif===true?3:(f.verif===false?8:null);
    if(radio && map.getZoom()>=18) L.circle([f.lat,f.lon],{radius:radio,weight:0,fillOpacity:.12,fillColor:'#2a4b8d',interactive:false}).addTo(lyFarolas);

    m.bindTooltip(f.id,{permanent:map.getZoom()>=18,direction:'right',className:'lbl',offset:[6,0]});
    m.on('click',e=>{ L.DomEvent.stopPropagation(e); if(mode==='vecino') startDraft({tipo:'farola',farolaId:f.id,lat:f.lat,lon:f.lon}); else showFarolaJunta(f); });
    m.addTo(lyFarolas);
  });
}
function drawIncid(){
  lyIncid.clearLayers();
  incid.filter(i=>!i.farolaId && (mode==='junta' && filtro==='completado' ? i.estado==='completado' : i.estado!=='completado')).forEach(i=>{
    const icon = L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
      html:`<div style="width:22px;height:22px;transform:rotate(45deg);background:${getCss('var(--st-'+i.estado+')')};border:2px solid #fff;border-radius:4px;box-shadow:0 1px 3px #0006"></div>`});

}
function getCss(v){ const m=v.match(/var\((--[^)]+)\)/); return m? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : v; }

function drawTramos(){
  lyTramos.clearLayers();
  tramos.forEach(t=>{
    L.polyline(t.pts,{color:getCss('var(--calle)'),weight:5,opacity:.85,interactive:false}).addTo(lyTramos);
    const hit = L.polyline(t.pts,{color:'#000',weight:26,opacity:0}); // zona de toque ancha
    hit.bindTooltip(t.calle,{sticky:true});
    hit.on('click',e=>{ L.DomEvent.stopPropagation(e); onMapTap(e.latlng); });
    hit.addTo(lyTramos);
  });
}
function nearestTramo(ll){
  const P = map.latLngToLayerPoint(ll); let best=null;
  tramos.forEach(t=>{ const pts=t.pts.map(q=>map.latLngToLayerPoint(q));
    for(let k=0;k<pts.length-1;k++){ const c=L.LineUtil.closestPointOnSegment(P,pts[k],pts[k+1]);
      const lat=map.layerPointToLatLng(c), d=map.distance(ll,lat); if(!best||d<best.d) best={calle:t.calle,ll:lat,d}; } });
  return best;
}
function onMapTap(ll){
  if(mode!=='vecino') return;
  const n = nearestTramo(ll);
  if(n && n.d<=30) startDraft({tipo:'bache',lat:ll.lat,lon:ll.lng,calle:n.calle});
  else startDraft({tipo:'otro',lat:ll.lat,lon:ll.lng,calle:''});
}
map.on('click',e=>onMapTap(e.latlng));

function startDraft(d){

function submit(){
  if(draft.tipo==='farola' && !draft.farolaId){
    const n = nearestFarola(draft.lat,draft.lon);
    if(n && n.d<25) draft.farolaId = n.f.id; else { toast('Toca la farola en el mapa para indicar cuál es'); return; }
  }
  const fo = draft.tipo==='farola' && farolas.find(x=>x.id===draft.farolaId);
  const i = {id:'I'+Date.now().toString(36), tipo:draft.tipo, farolaId:draft.tipo==='farola'?draft.farolaId:null, calle: fo? fo.calle : draft.calle,
    lat:draft.lat, lon:draft.lon, desc:draft.desc.trim(), contacto:(draft.contacto||'').trim(), foto:draft.foto, estado:'nuevo', votos:1, creada:Date.now(), hist:[{t:Date.now(),e:'nuevo'}]};
  const btn=document.getElementById('send'); btn.disabled=true; btn.textContent='Enviando…';
  api('POST','',i).then(()=>{
    incid.unshift(i);
    if(!save()){ incid.shift(); btn.disabled=false; btn.textContent='Enviar a la junta'; return; }
    cancelDraft(); renderEnviada(i);
  }).catch(e=>{ btn.disabled=false; btn.textContent='Enviar a la junta'; toast('No se pudo enviar: '+e.message); });
}

function demo(silent){
  if(!farolas.length){ toast('Carga primero las farolas'); return; }
  const pick = n=>farolas[Math.floor(n*farolas.length)];
  const now=Date.now(), d=864e5;
  const f1=pick(.1), f2=pick(.45), f3=pick(.8), f4=pick(.6);
  const off=(f,dx,dy)=>({lat:f.lat+dy,lon:f.lon+dx});
  const ej = [
    {tipo:'farola',farolaId:f1.id,calle:f1.calle,...off(f1,0,0),desc:'[Ejemplo] Lleva tres noches apagada',estado:'nuevo',votos:3,creada:now-2*d},
    {tipo:'farola',farolaId:f2.id,calle:f2.calle,...off(f2,0,0),desc:'[Ejemplo] Parpadea',estado:'encurso',votos:1,creada:now-6*d},
    {tipo:'bache',calle:f3.calle,...off(f3,0,0),desc:'[Ejemplo] Bache en la calzada frente al portal',estado:'nuevo',votos:1,creada:now-1*d},
    {tipo:'fuga',calle:f4.calle,...off(f4,-.0001,.00008),desc:'[Ejemplo] Sale agua junto a la arqueta',estado:'completado',votos:2,creada:now-12*d},
  ].map((x,k)=>({id:'E'+k+now.toString(36),foto:null,hist:[{t:x.creada,e:'nuevo'}].concat(x.estado!=='nuevo'?[{t:x.creada+d,e:x.estado}]:[]),...x}));
  incid = ej.concat(incid); save(); if(!silent) toast('Añadidos 4 ejemplos');
}

/* ===== Utilidades ===== */
function save(){ const ok = CONFIG.API_URL ? true : store.set(LS_I,incid); render(); return ok; }
async function api(method, path, body){
  if(!CONFIG.API_URL) return null;
  const r = await fetch(CONFIG.API_URL.replace(/\/$/,'')+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error('El servidor respondió '+r.status);
  return r.status===204?null:r.json();
}
async function cargar(){
  if(CONFIG.API_URL){
    try{ incid = await api('GET',''); }catch(e){ incid=[]; toast('No se pudieron cargar las incidencias: '+e.message); }
  } else if(!incid){ incid=[]; demo(true); }
  render();
}
function sumarse(i){
  i.votos=(i.votos||1)+1; i.hist.push({t:Date.now(),e:'+1 vecino'});
  api('PATCH','/'+i.id,{votos:i.votos}).catch(e=>toast('No se pudo enviar: '+e.message));
  save(); toast('Gracias. Sumado a la incidencia existente ('+i.votos+' vecinos).');
}
function textoIncidencia(i){
  return `${TIPOS[i.tipo]}${i.farolaId?' '+i.farolaId:''}${i.calle?' ('+i.calle+')':''}${i.desc?': '+i.desc:''}\nhttps://maps.google.com/?q=${i.lat.toFixed(6)},${i.lon.toFixed(6)}`;
}
function waLink(txt){ return 'https://wa.me/'+(CONFIG.WHATSAPP_NUM||'')+'?text='+encodeURIComponent(txt); }
function locate(cb){
  if(!navigator.geolocation){ toast('Este navegador no da ubicación: toca el punto en el mapa'); return; }
  toast('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(p=>{
    const r={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    if(gpsCircle) map.removeLayer(gpsCircle);
    gpsCircle = L.circle([r.lat,r.lon],{radius:r.acc,weight:1,fillOpacity:.08}).addTo(map);
    map.setView([r.lat,r.lon],Math.max(map.getZoom(),18)); cb(r);
  }, e=>toast('Sin ubicación ('+e.message+'). Toca el punto en el mapa.'), {enableHighAccuracy:true,timeout:10000});
}
function resizeImg(file,cb){
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const s=Math.min(1,900/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',.6)); };
  img.onerror=()=>toast('No se pudo leer la imagen'); img.src=url;
}
function fecha(t){ return new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
