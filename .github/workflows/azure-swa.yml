name: Despliegue Azure Static Web Apps

# En cada push a main (y a mano). Si el push toca infra/** o data/**, primero despliega la
# infraestructura y siembra las farolas que falten (infra-desplegar.yml, entorno `infra`: espera la
# aprobación de Rafa); si no, despliega la app directamente, sin aprobaciones (decisión del 2026-11-15).
# No hay previews por PR: no se dispara en pull_request.
# El token de la app se obtiene por OIDC con id-buenavista-app (entorno `produccion`, solo main).
# Sin la variable AZURE_CLIENT_ID_APP, o si la SWA no existe, el job de la app termina en verde con un aviso.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: azure-swa
  cancel-in-progress: false

jobs:
  cambios:
    name: ¿Cambia la infra?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      infra: ${{ steps.mirar.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: mirar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compara con el último commit en el que la infra SÍ se desplegó bien (no con el push anterior),
          # para que un despliegue de infra rechazado, fallido o cancelado no se pierda.
          # A mano, o sin referencia válida, se despliega todo.
          desplegar() { echo "infra=$1" >> "$GITHUB_OUTPUT"; echo "Infra: $1 ($2)"; exit 0; }
          [ "$GITHUB_EVENT_NAME" = push ] || desplegar true "lanzado a mano"
          ultimo=""
          # Automático: último run de este workflow cuyo job de infra terminó bien.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/azure-swa.yml/runs?branch=main&status=completed&per_page=30" --jq '.workflow_runs[].id'); do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select((.name | startswith("Infraestructura y farolas")) and .conclusion == "success")] | length')
            if [ "$ok" -gt 0 ]; then
              ultimo=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '"\(.created_at) \(.head_sha)"')
              break
            fi
          done
          # Manual: último run con éxito de infra-desplegar.yml; vale el más reciente de los dos.
          manual=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/infra-desplegar.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0] // empty | "\(.created_at) \(.head_sha)"')
          ref=$(printf '%s\n%s\n' "$ultimo" "$manual" | sort | tail -n1 | cut -d' ' -f2)
          [ -n "$ref" ] && git merge-base --is-ancestor "$ref" "$GITHUB_SHA" 2>/dev/null || desplegar true "sin despliegue de infra previo válido"
          if git diff --name-only "$ref" "$GITHUB_SHA" | grep -qE '^(infra/|data/|\.github/workflows/infra-desplegar\.yml$)'; then
            desplegar true "cambios de infra desde ${ref:0:7}"
          fi
          desplegar false "sin cambios de infra desde ${ref:0:7}"

  infra:
    name: Infraestructura y farolas
    needs: cambios
    if: needs.cambios.outputs.infra == 'true' && vars.AZURE_CLIENT_ID_INFRA != ''
    uses: ./.github/workflows/infra-desplegar.yml
    permissions:
      contents: read
      id-token: write

  deploy:
    name: App
    needs: infra
    # Si la infra no cambia, el job anterior se salta y la app se despliega igual; si falla o se rechaza, no.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
      id-token: write
    env:
      RG: rg-buenavista-incidencias
      SWA: swa-buenavista
    steps:
      - name: Sin identidad, se omite el despliegue
        if: vars.AZURE_CLIENT_ID_APP == ''
        run: echo "::notice::Falta la variable AZURE_CLIENT_ID_APP; despliegue omitido."
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: vars.AZURE_CLIENT_ID_APP != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Token de despliegue (enmascarado)
        id: token
        if: vars.AZURE_CLIENT_ID_APP != ''
        run: |
          # Solo se omite si la SWA no existe; cualquier otro fallo (permisos, ARM) deja el job en rojo.
          if ! az staticwebapp show -n "$SWA" -g "$RG" --only-show-errors -o none 2> err.txt; then
            if grep -qE 'ResourceNotFound|ResourceGroupNotFound' err.txt; then
              echo "::notice::La SWA $SWA no existe todavía (¿falta desplegar la infraestructura?); despliegue omitido."
              exit 0
            fi
            cat err.txt
            exit 1
          fi
          token=$(az staticwebapp secrets list -n "$SWA" -g "$RG" --query properties.apiKey -o tsv --only-show-errors)
          test -n "$token" || { echo "::error::Token de despliegue vacío"; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.token != ''
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        if: steps.token.outputs.token != ''
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          # Oryx (el build de Azure dentro del action) compila; la versión de Node sale de `engines`.
          app_location: web
          api_location: api
          output_location: dist/web/browser
