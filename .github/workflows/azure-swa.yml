name: Despliegue Azure Static Web Apps

# No hace nada hasta que exista el secreto AZURE_STATIC_WEB_APPS_API_TOKEN
# (Azure Portal → Static Web App → Manage deployment token → GitHub Secrets).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Sin token, se omite el despliegue
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Falta AZURE_STATIC_WEB_APPS_API_TOKEN; despliegue omitido."
      - uses: actions/checkout@v4
        if: env.SWA_TOKEN != ''
      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: dist/web/browser
