name: Despliegue Azure Static Web Apps

# Solo en push a main (y a mano). No hay previews por PR: no se dispara en pull_request.
# Sin el secreto AZURE_STATIC_WEB_APPS_API_TOKEN termina en verde con un aviso.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-swa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Sin token, se omite el despliegue
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Falta el secreto AZURE_STATIC_WEB_APPS_API_TOKEN; despliegue omitido."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SWA_TOKEN != ''
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          # Oryx (el build de Azure dentro del action) compila; la versión de Node sale de `engines`.
          app_location: web
          api_location: api
          output_location: dist/web/browser
