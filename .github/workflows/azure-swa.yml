name: Despliegue Azure Static Web Apps

# Solo en push a main (y a mano). No hay previews por PR: no se dispara en pull_request.
# El token de despliegue se obtiene por OIDC con id-buenavista-app (entorno `produccion`, solo main).
# Sin la variable AZURE_CLIENT_ID_APP o sin la SWA desplegada, termina en verde con un aviso.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: azure-swa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
      id-token: write
    env:
      RG: rg-buenavista-incidencias
      SWA: swa-buenavista
    steps:
      - name: Sin identidad, se omite el despliegue
        if: vars.AZURE_CLIENT_ID_APP == ''
        run: echo "::notice::Falta la variable AZURE_CLIENT_ID_APP; despliegue omitido."
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: vars.AZURE_CLIENT_ID_APP != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Token de despliegue (enmascarado)
        id: token
        if: vars.AZURE_CLIENT_ID_APP != ''
        run: |
          if ! token=$(az staticwebapp secrets list -n "$SWA" -g "$RG" --query properties.apiKey -o tsv --only-show-errors 2>/dev/null) || [ -z "$token" ]; then
            echo "::notice::La SWA $SWA no existe o no es accesible todavía (¿falta desplegar infra.yml?); despliegue omitido."
            exit 0
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.token != ''
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        if: steps.token.outputs.token != ''
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          # Oryx (el build de Azure dentro del action) compila; la versión de Node sale de `engines`.
          app_location: web
          api_location: api
          output_location: dist/web/browser
