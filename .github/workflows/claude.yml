# Claude Code trabaja a partir de issues y comentarios de GitHub.
#  - Etiqueta `claude` en un issue: Claude lee el issue, crea una rama claude/issue-<n>-<fecha>,
#    hace commits y deja en el issue un comentario con lo hecho. El paso final abre el PR
#    (Closes #<n>) y lo asigna al dueño del repo, con el token del secreto PR_TOKEN.
#  - `@claude` en un comentario de issue o de PR (o en una revisión): Claude responde o
#    sigue trabajando; en un PR hace push a la rama del PR.
# Flujo Spec Kit (spec → revisión → implementación) descrito en AGENTS.md.
# Límites: herramientas en --allowedTools, --max-turns y timeout-minutes del job.
# Solo lo puede disparar el dueño del repo (github.repository_owner).
# Autenticación con la suscripción de Claude (secreto CLAUDE_CODE_OAUTH_TOKEN), sin API de pago.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^22.22.3"

      - id: claude
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 120
            --allowedTools "Skill,Bash(.specify/scripts/bash/check-prerequisites.sh:*),Bash(.specify/scripts/bash/create-new-feature.sh:*),Bash(.specify/scripts/bash/resolve-template.sh:*),Bash(.specify/scripts/bash/setup-plan.sh:*),Bash(.specify/scripts/bash/setup-tasks.sh:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx ng:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(node:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(diff:*),Bash(mkdir:*)"

      # Abre el PR de la rama que deja Claude en un issue. Usa un token de Rafa (secreto PR_TOKEN,
      # fine-grained, solo este repo: Contents read, Pull requests write e Issues write) para que el PR dispare
      # la CI y el revisor; con GITHUB_TOKEN no se dispararían. Sin el secreto, deja un aviso y
      # sigue valiendo el enlace "Create PR" del comentario.
      - name: Abrir PR
        if: >-
          always() && steps.claude.outputs.branch_name != '' &&
          (github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request))
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Falta el secreto PR_TOKEN: abre el PR con el enlace del comentario."
            exit 0
          fi
          if ! gh api "repos/$REPO/branches/$BRANCH" --silent 2>/dev/null; then
            echo "Claude no ha subido la rama $BRANCH; no hay PR que abrir."
            exit 0
          fi
          ahead=$(gh api "repos/$REPO/compare/$BASE...$BRANCH" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "La rama $BRANCH no tiene commits nuevos; no se abre PR."
            exit 0
          fi
          # Cada ejecución crea una rama claude/issue-<n>-<fecha>; si el issue ya tiene un PR
          # abierto (de esta rama o de una anterior), no se abre otro.
          existing=$(gh pr list -R "$REPO" --state open --limit 100 --json number,headRefName,body \
            --jq '[.[] | select(.headRefName == env.BRANCH or (.headRefName | startswith("claude/issue-" + env.ISSUE + "-")) or (.body | test("(?i)closes #" + env.ISSUE + "\\b")))][0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::Ya existe el PR #$existing para el issue #$ISSUE; no se abre otro. Sigue la conversación en ese PR."
            exit 0
          fi
          printf 'Closes #%s\n\nPR abierto automáticamente por el workflow Claude a partir del issue #%s. El detalle de lo hecho está en el comentario de Claude en el issue.\n' "$ISSUE" "$ISSUE" > "$RUNNER_TEMP/pr-body.md"
          gh pr create -R "$REPO" --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md" --assignee "$OWNER"
