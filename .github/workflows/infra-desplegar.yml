name: Desplegar infraestructura (Bicep)

# Despliega infra/main.bicep y después siembra las farolas y los usuarios (secreto USUARIOS_ALTA) que
# falten (solo altas, cada una auditada con sistema:carga; relanzarlo dice "Altas: 0"). Un único job
# en el entorno `infra`, así que pide UNA aprobación de Rafa. Lo llama azure-swa.yml en un push a main
# que toca infra/** o data/**; a mano sirve para reactivar Storage tras un corte o dar de alta usuarios. El Bicep ya se validó en el PR (infra.yml).
on:
  workflow_call:
    secrets:
      AVISOS_EMAIL:
        description: Correo de los avisos del presupuesto (si el entorno infra tiene su propio secreto, manda ese).
        required: false
      USUARIOS_ALTA:
        description: Lista de altas "correo,rol" por línea (specs/007-alta-usuarios); manda la del entorno infra.
        required: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: infra-desplegar
  cancel-in-progress: false

env:
  RG: rg-buenavista-incidencias
  CORTE_ROLE_NAME: Buenavista corte de Storage

jobs:
  desplegar:
    name: Desplegar (Azure)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^22.22.3"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Compilar la API (script de carga)
        working-directory: api
        run: |
          npm ci
          npm run build
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: No reactivar Storage tras un corte sin querer
        run: |
          # El Bicep fija publicNetworkAccess: Enabled. Tras un corte por presupuesto, solo se reactiva
          # lanzando este workflow a mano (decisión del 2026-11-12: "se reactiva a mano"); desde azure-swa.yml
          # (push o relanzado) falla aquí y no despliega nada (ni farolas ni app).
          cuenta=$(az storage account list -g "$RG" --query "[?starts_with(name, 'stbuenavista')].name | [0]" -o tsv --only-show-errors)
          test -n "$cuenta" || exit 0  # primer despliegue: aún no hay cuenta
          acceso=$(az storage account show -g "$RG" -n "$cuenta" --query publicNetworkAccess -o tsv --only-show-errors)
          # github.workflow es el nombre del workflow que se lanzó (en una llamada, el que llama): solo
          # este, lanzado a mano, reactiva; relanzar el despliegue de la app no.
          if [ "$acceso" = Disabled ] && { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_WORKFLOW" != "Desplegar infraestructura (Bicep)" ]; }; then
            echo "::error::Storage está cortado por presupuesto. Revisa la causa y reactívalo lanzando a mano 'Desplegar infraestructura (Bicep)' (infra/README.md)."
            exit 1
          fi
      - name: Desplegar
        env:
          AVISOS_EMAIL: ${{ secrets.AVISOS_EMAIL }}
        run: |
          test -n "$AVISOS_EMAIL" || { echo "::error::El secreto AVISOS_EMAIL llega vacío (¿falta en el entorno infra o en el repositorio?)"; exit 1; }
          CORTE_ROLE_ID=$(az role definition list --custom-role-only true --name "$CORTE_ROLE_NAME" --query "[0].name" -o tsv)
          test -n "$CORTE_ROLE_ID" || { echo "::error::No existe el rol \"$CORTE_ROLE_NAME\" (paso único de infra/README.md)"; exit 1; }
          export CORTE_ROLE_ID
          # -o none: la salida completa del despliegue no se imprime; solo los outputs (sin secretos).
          az deployment group create -g "$RG" -n "infra-${GITHUB_RUN_ID}" \
            --parameters infra/main.bicepparam --only-show-errors -o none
          {
            echo '## Infraestructura desplegada'
            az deployment group show -g "$RG" -n "infra-${GITHUB_RUN_ID}" \
              --query "properties.outputs.{swa:swaName.value, url:swaHostname.value, storage:storageName.value}" -o table | sed 's/^/    /'
            echo
            echo 'El SAS de datos caduca dentro de un año: vuelve a desplegar antes (infra/README.md).'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: SAS de 1 h por tabla para la carga (enmascarados)
        run: |
          cuenta=$(az storage account list -g "$RG" --query "[?starts_with(name, 'stbuenavista')].name | [0]" -o tsv --only-show-errors)
          test -n "$cuenta" || { echo "::error::No hay cuenta stbuenavista* en $RG"; exit 1; }
          endpoint=$(az storage account show -g "$RG" -n "$cuenta" --query primaryEndpoints.table -o tsv --only-show-errors)
          clave=$(az storage account keys list -g "$RG" -n "$cuenta" --query "[0].value" -o tsv --only-show-errors)
          echo "::add-mask::$clave"
          caduca=$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%MZ')
          sas() {
            az storage table generate-sas --name "$1" --permissions "$2" --expiry "$caduca" --https-only \
              --account-name "$cuenta" --account-key "$clave" -o tsv --only-show-errors
          }
          # Farolas y Usuarios rad: el borrado solo deshace un alta cuya auditoría falle (la app sigue
          # con Usuarios ru). Auditoria a: solo añadir.
          sas_farolas=$(sas Farolas rad)
          sas_usuarios=$(sas Usuarios rad)
          sas_auditoria=$(sas Auditoria a)
          echo "::add-mask::$sas_farolas"
          echo "::add-mask::$sas_usuarios"
          echo "::add-mask::$sas_auditoria"
          {
            echo "FAROLAS_CONNECTION=TableEndpoint=${endpoint};SharedAccessSignature=${sas_farolas}"
            echo "USUARIOS_CONNECTION=TableEndpoint=${endpoint};SharedAccessSignature=${sas_usuarios}"
            echo "AUDITORIA_CONNECTION=TableEndpoint=${endpoint};SharedAccessSignature=${sas_auditoria}"
          } >> "$GITHUB_ENV"
      - name: Cargar farolas (solo altas)
        working-directory: api
        run: |
          set -o pipefail
          node dist/scripts/cargar-farolas.js ../data/farolas_buenavista.csv | tee salida.txt
          {
            echo '## Carga de farolas'
            sed 's/^/    /' salida.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cargar usuarios (solo altas)
        working-directory: api
        env:
          # Secreto del entorno infra: nunca se imprime (GitHub lo enmascara y el script solo da recuentos).
          USUARIOS_ALTA: ${{ secrets.USUARIOS_ALTA }}
        run: |
          set -o pipefail
          node dist/scripts/cargar-usuarios.js | tee salida.txt
          {
            echo '## Carga de usuarios'
            sed 's/^/    /' salida.txt
          } >> "$GITHUB_STEP_SUMMARY"
